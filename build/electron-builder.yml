appId: cn.bit-helper.neuromark
productName: NeuroMark
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
asar: true
asarUnpack:
  - node_modules/sharp/**
  - node_modules/@img/sharp-*/**
  - node_modules/@img/sharp-libvips-*/**
  - node_modules/@napi-rs/canvas*/**
mac:
  category: public.app-category.education
  artifactName: NeuroMark-${version}-macos-${arch}.${ext}
  target:
    - dmg
win:
  artifactName: NeuroMark-${version}-windows-${arch}-setup.${ext}
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
linux:
  artifactName: NeuroMark-${version}-linux-${arch}.${ext}
  target:
    - AppImage
    - deb
  category: Education
